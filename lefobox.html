<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            border-left: 4px solid #c0392b;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 Вход в систему</h2>
        
        <div id="errorMessage" class="error-message">
            ❌ Неверный логин или пароль!
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="Введите логин" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="btn-login">Войти</button>
        </form>

        <div class="info">
            <strong>Тестовые данные:</strong><br>
            Логин: <strong>admin</strong> | Пароль: <strong>123456</strong>
        </div>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        // Замените логин и пароль на свои
        const VALID_USERNAME = 'admin';
        const VALID_PASSWORD = '123456';
        // Страница, куда перенаправить при успешном входе
        const DASHBOARD_URL = 'dashboard.html';
        // Страница, куда перенаправить при ошибке ("выкидывает с сайта")
        const ERROR_URL = 'access-denied.html';
        // =====================

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Обработка отправки формы
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Проверка логина и пароля
            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                // Успешный вход — переходим на защищённую страницу
                window.location.href = DASHBOARD_URL;
            } else {
                // Неправильные данные — показываем ошибку и через 2 секунды "выкидываем"
                errorDiv.textContent = '❌ Неверный логин или пароль!';
                errorDiv.classList.add('show');

                // Через 2 секунды перенаправляем на страницу ошибки
                setTimeout(() => {
                    window.location.href = ERROR_URL;
                }, 2000);
            }
        });

        // Скрываем ошибку при вводе
        usernameInput.addEventListener('input', function() {
            errorDiv.classList.remove('show');
        });
        passwordInput.addEventListener('input', function() {
            errorDiv.classList.remove('show');
        });
    </script>
</body>
</html>
